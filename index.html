<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DARSI WebXR — Indoor Navigation</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee;
      font: 14px/1.5 system-ui, -apple-system, sans-serif; }
    /* HUD tetap terlihat saat sesi AR lewat WebXR DOM overlay (overlayRoot = body) */
    #hud { position: fixed; inset: 0 0 auto 0; padding: 12px 14px;
      background: rgba(0,0,0,.6); white-space: pre-wrap; z-index: 10;
      pointer-events: none; }
    #hud b { color: #00ff88; }
    .warn { color: #ffb020; }
    .err  { color: #ff5060; }

    /* Bottom Floating Nav Panel */
    #nav-controls {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
    }
    .panel-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #poi-select {
      flex: 1;
      background: rgba(30, 41, 59, 0.9);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    .btn-action {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      color: #ffffff;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    #btn-ar {
      background: linear-gradient(135deg, #10b981, #059669);
      min-width: 116px;
    }
    /* Saat sesi AR aktif tombolnya jadi merah — warnanya sendiri yang memberi tahu keadaan,
       bukan cuma labelnya. */
    #btn-ar.aktif {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }
    #btn-ar:active, #btn-done:active { transform: scale(0.96); }
    #btn-done {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 100%;
      font-weight: 500;
    }

    /* Alat developer: grid rapat DI DALAM panel, tidak melayang menimpa apa pun. */
    #admin-tools {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    #admin-tools button {
      border: 0;
      border-radius: 8px;
      padding: 9px 8px;
      font: 600 12px system-ui;
      color: #fff;
      cursor: pointer;
    }
    #admin-tools button:active { transform: scale(0.96); }

    /* Toggle Switch Slider (Mode Admin / Developer) */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: #334155; transition: .25s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px;
      left: 3px; bottom: 3px; background-color: white;
      transition: .25s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(18px); }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="hud">DARSI WebXR — memuat…</div>

  <!--
    Dua kontrol, dua urusan berbeda:
      #btn-ar     → kamera AR menyala/mati. Tidak butuh tujuan.
      #poi-select → tujuan. Bisa diganti kapan saja tanpa mematikan AR; pilih opsi
                    kosong untuk berhenti menavigasi.
    Alat developer TIDAK melayang di atas panel ini — semuanya masuk #admin-tools.
  -->
  <div id="nav-controls">
    <div class="panel-row">
      <select id="poi-select">
        <option value="">-- Tanpa tujuan (AR saja) --</option>
      </select>
      <button id="btn-ar" class="btn-action">MULAI AR</button>
    </div>

    <!-- Jalan kembali ke MyRSIy (deep link). WAJIB terlihat di produksi, bukan alat admin. -->
    <button id="btn-done" class="btn-action">SELESAI ✓</button>

    <div class="switch-row">
      <span>🛠️ Mode Admin</span>
      <label class="switch">
        <input type="checkbox" id="toggle-debug-mode">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Hanya mengatur TAMPIL/SEMBUNYI. Apakah mesh diunduh ditentukan saat halaman dimuat
         (lihat MESH_TERSEDIA di main.js) — SDK membaca showMesh sekali di constructor. -->
    <div id="mesh-row" class="switch-row hidden">
      <span>🧱 Tampilkan Mesh Gedung</span>
      <label class="switch">
        <input type="checkbox" id="toggle-mesh">
        <span class="slider"></span>
      </label>
    </div>

    <div id="admin-tools" class="hidden"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
